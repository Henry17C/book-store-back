spring.application.name=book-store-back
# ==========================================
# 1. Configuración de Microsoft SQL Server
# ==========================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=bookstore_db;encrypt=true;trustServerCertificate=true;
spring.datasource.username=hy
spring.datasource.password=12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==========================================
# 2. Configuración de Hibernate (JPA)
# ==========================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
#spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# 3. Configuración de Flyway (Migraciones)
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true